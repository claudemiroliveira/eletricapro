<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EletricaPRO — Login</title>

  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d2e;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #f5c518;
      --blue: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --text: #e2e8f0;
      --muted: #7c8db0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    /* CONTAINER */

    .container {
      width: 100%;
      max-width: 430px;
    }

    /* LOGO */

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 70px;
      height: 70px;

      background: var(--accent);
      color: #000;

      border-radius: 18px;

      font-size: 38px;

      margin-bottom: 14px;

      box-shadow: 0 8px 25px rgba(245, 197, 24, .2);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
    }

    .header h1 span {
      color: var(--accent);
    }

    .header p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 5px;
    }

    /* LOGIN BOX */

    .login-box {
      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 26px 24px;

      box-shadow: 0 15px 50px rgba(0,0,0,.25);
    }

    .login-box h2 {
      text-align: center;
      font-size: 21px;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 22px;
    }

    /* TABS */

    .auth-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .auth-tab {
      flex: 1;

      padding: 10px;

      text-align: center;

      background: var(--surface2);
      border: 1px solid var(--border);

      border-radius: 9px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      transition: .2s;
    }

    .auth-tab:hover {
      border-color: var(--blue);
    }

    .auth-tab.active {
      background: linear-gradient(135deg, #1565c0, #3b82f6);
      border-color: var(--blue);
      color: #fff;
    }

    /* FORMS */

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    /* INPUT */

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;

      color: var(--muted);

      font-size: 13px;
      font-weight: 600;

      margin-bottom: 6px;
    }

    .field input {
      width: 100%;

      padding: 12px 14px;

      background: var(--surface2);

      border: 1.5px solid var(--border);
      border-radius: 9px;

      color: var(--text);

      font-size: 14px;

      transition: .2s;
    }

    .field input:focus {
      outline: none;

      border-color: var(--blue);

      background: rgba(59,130,246,.08);

      box-shadow:
        0 0 0 3px rgba(59,130,246,.15);
    }

    .field input::placeholder {
      color: var(--muted);
    }

    /* PASSWORD */

    .pwd-wrapper {
      position: relative;
    }

    .pwd-wrapper input {
      padding-right: 45px;
    }

    .pwd-toggle {
      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      background: none;
      border: none;

      color: var(--muted);

      cursor: pointer;

      font-size: 17px;
    }

    .pwd-toggle:hover {
      color: var(--text);
    }

    /* MESSAGES */

    .auth-msg {
      display: none;

      padding: 10px 13px;

      border-radius: 9px;

      font-size: 13px;

      margin-bottom: 14px;
    }

    .auth-msg.error {
      display: block;

      background: rgba(239,68,68,.12);
      border: 1px solid var(--red);

      color: #fca5a5;
    }

    .auth-msg.success {
      display: block;

      background: rgba(34,197,94,.12);
      border: 1px solid var(--green);

      color: #86efac;
    }

    /* FORGOT PASSWORD */

    .forgot {
      text-align: right;

      margin-top: -5px;
      margin-bottom: 12px;
    }

    .forgot a {
      color: var(--muted);

      font-size: 12px;

      cursor: pointer;

      text-decoration: none;
    }

    .forgot a:hover {
      color: var(--blue);
    }

    /* BUTTON */

    .btn-login {
      width: 100%;

      padding: 13px;

      border: none;
      border-radius: 10px;

      background: linear-gradient(
        135deg,
        #1565c0,
        #3b82f6
      );

      color: #fff;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition: .2s;
    }

    .btn-login:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;

      gap: 10px;

      margin: 18px 0;

      color: var(--muted);

      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background: var(--border);
    }

    /* GOOGLE */

    .google-btn {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      padding: 13px;

      background: #fff;

      color: #000;

      border: none;

      border-radius: 10px;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition: .2s;
    }

    .google-btn:hover {
      filter: brightness(.92);
    }

    .google-btn svg {
      width: 18px;
      height: 18px;
    }

    /* FOOTER */

    .footer {
      text-align: center;

      color: var(--muted);

      font-size: 11px;

      margin-top: 18px;
    }

    /* SPINNER */

    .spinner {
      width: 18px;
      height: 18px;

      border: 3px solid rgba(255,255,255,.3);

      border-top-color: #fff;

      border-radius: 50%;

      animation: spin .7s linear infinite;

      margin: auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* MOBILE */

    @media (max-width: 420px) {
      body {
        padding: 14px;
      }

      .login-box {
        padding: 22px 18px;
      }

      .header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->

    <div class="header">

      <div class="logo">
        ⚡
      </div>

      <h1>
        Eletrica<span>PRO</span>
      </h1>

      <p>
        Entre ou crie sua conta
      </p>

    </div>


    <!-- LOGIN -->

    <div class="login-box">

      <h2>🔐 Acesso</h2>

      <p class="subtitle">
        Acesse sua conta EletricaPRO
      </p>


      <!-- TABS -->

      <div class="auth-tabs">

        <div
          class="auth-tab active"
          id="tabLogin"
          onclick="switchTab('login')">

          Entrar

        </div>

        <div
          class="auth-tab"
          id="tabRegister"
          onclick="switchTab('register')">

          Criar conta

        </div>

      </div>


      <!-- FORM LOGIN -->

      <div
        class="auth-form active"
        id="formLogin">

        <div
          id="loginMsg"
          class="auth-msg">
        </div>


        <div class="field">

          <label>
            📧 E-mail
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="seu@email.com"
            autocomplete="email">

        </div>


        <div class="field">

          <label>
            🔒 Senha
          </label>

          <div class="pwd-wrapper">

            <input
              type="password"
              id="loginPassword"
              placeholder="Sua senha"
              autocomplete="current-password">

            <button
              type="button"
              class="pwd-toggle"
              onclick="togglePwd('loginPassword', this)">

              👁

            </button>

          </div>

        </div>


        <div class="forgot">

          <a onclick="sendPasswordReset()">
            Esqueceu a senha?
          </a>

        </div>


        <button
          class="btn-login"
          id="btnEmailLogin"
          onclick="loginWithEmail()">

          Entrar

        </button>


        <div class="divider">
          ou
        </div>


        <button
          class="google-btn"
          id="btnGoogleLogin">

          <svg viewBox="0 0 48 48">

            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>

            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>

            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

          </svg>

          Entrar com Google

        </button>

      </div>


      <!-- FORM CADASTRO -->

      <div
        class="auth-form"
        id="formRegister">

        <div
          id="registerMsg"
          class="auth-msg">
        </div>


        <div class="field">

          <label>
            👤 Nome completo
          </label>

          <input
            type="text"
            id="registerName"
            placeholder="Seu nome"
            autocomplete="name">

        </div>


        <div class="field">

          <label>
            📧 E-mail
          </label>

          <input
            type="email"
            id="registerEmail"
            placeholder="seu@email.com"
            autocomplete="email">

        </div>


        <div class="field">

          <label>
            🔒 Senha
          </label>

          <div class="pwd-wrapper">

            <input
              type="password"
              id="registerPassword"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password">

            <button
              type="button"
              class="pwd-toggle"
              onclick="togglePwd('registerPassword', this)">

              👁

            </button>

          </div>

        </div>


        <div class="field">

          <label>
            🔒 Confirmar senha
          </label>

          <div class="pwd-wrapper">

            <input
              type="password"
              id="registerConfirm"
              placeholder="Repita a senha"
              autocomplete="new-password">

            <button
              type="button"
              class="pwd-toggle"
              onclick="togglePwd('registerConfirm', this)">

              👁

            </button>

          </div>

        </div>


        <button
          class="btn-login"
          id="btnEmailRegister"
          onclick="registerWithEmail()">

          Criar conta

        </button>


        <div class="divider">
          ou
        </div>


        <button
          class="google-btn"
          id="btnGoogleRegister">

          <svg viewBox="0 0 48 48">

            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>

            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>

            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

          </svg>

          Cadastrar com Google

        </button>

      </div>

    </div>


    <div class="footer">
      © 2026 EletricaPRO
    </div>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyCibrDhAmeTg-2W9TiXhomotfLEM5EqwgE",

      authDomain:
        "eletrica-pro.firebaseapp.com",

      projectId:
        "eletrica-pro",

      storageBucket:
        "eletrica-pro.firebasestorage.app",

      messagingSenderId:
        "318733768519",

      appId:
        "1:318733768519:web:93e0bdcdecd49b9570de62"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    /* HELPERS */

    function showMsg(id, text, type) {

      const el =
        document.getElementById(id);

      el.textContent = text;

      el.className =
        "auth-msg " + type;

      el.style.display =
        "block";

    }


    function clearMessages() {

      document
        .querySelectorAll(".auth-msg")
        .forEach(el => {

          el.style.display = "none";
          el.textContent = "";

        });

    }


    /* LOGIN */

    window.loginWithEmail = async function() {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      const btn =
        document
          .getElementById("btnEmailLogin");


      if (!email || !password) {

        showMsg(
          "loginMsg",
          "⚠️ Preencha o e-mail e a senha.",
          "error"
        );

        return;
      }


      btn.disabled = true;

      btn.innerHTML =
        '<div class="spinner"></div>';


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        showMsg(
          "loginMsg",
          "✅ Login realizado com sucesso!",
          "success"
        );


        /*
          Se quiser mandar para o aplicativo
          depois do login, coloque aqui:

          window.location.href = "index.html";
        */

      } catch (e) {

        const messages = {

          "auth/user-not-found":
            "❌ E-mail não cadastrado.",

          "auth/wrong-password":
            "❌ Senha incorreta.",

          "auth/invalid-credential":
            "❌ E-mail ou senha incorretos.",

          "auth/invalid-email":
            "❌ E-mail inválido.",

          "auth/too-many-requests":
            "⚠️ Muitas tentativas. Tente novamente mais tarde.",

          "auth/user-disabled":
            "⚠️ Esta conta foi desativada."

        };


        showMsg(
          "loginMsg",
          messages[e.code] ||
          "❌ Erro ao entrar.",
          "error"
        );


        btn.disabled = false;

        btn.textContent =
          "Entrar";

      }

    };


    /* CADASTRO */

    window.registerWithEmail = async function() {

      const name =
        document
          .getElementById("registerName")
          .value
          .trim();

      const email =
        document
          .getElementById("registerEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("registerPassword")
          .value;

      const confirm =
        document
          .getElementById("registerConfirm")
          .value;

      const btn =
        document
          .getElementById("btnEmailRegister");


      if (!name) {

        showMsg(
          "registerMsg",
          "⚠️ Informe seu nome.",
          "error"
        );

        return;
      }


      if (!email) {

        showMsg(
          "registerMsg",
          "⚠️ Informe seu e-mail.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMsg(
          "registerMsg",
          "⚠️ A senha precisa ter pelo menos 6 caracteres.",
          "error"
        );

        return;
      }


      if (password !== confirm) {

        showMsg(
          "registerMsg",
          "⚠️ As senhas não coincidem.",
          "error"
        );

        return;
      }


      btn.disabled = true;

      btn.innerHTML =
        '<div class="spinner"></div>';


      try {

        const credential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await updateProfile(
          credential.user,
          {
            displayName: name
          }
        );


        showMsg(
          "registerMsg",
          "✅ Conta criada com sucesso!",
          "success"
        );


        /*
          Se quiser mandar para o aplicativo
          depois do cadastro:

          window.location.href = "index.html";
        */


      } catch (e) {

        const messages = {

          "auth/email-already-in-use":
            "❌ Este e-mail já está cadastrado.",

          "auth/invalid-email":
            "❌ E-mail inválido.",

          "auth/weak-password":
            "❌ A senha é muito fraca."

        };


        showMsg(
          "registerMsg",
          messages[e.code] ||
          "❌ Erro ao criar a conta.",
          "error"
        );


        btn.disabled = false;

        btn.textContent =
          "Criar conta";

      }

    };


    /* RECUPERAÇÃO DE SENHA */

    window.sendPasswordReset = async function() {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();


      if (!email) {

        showMsg(
          "loginMsg",
          "⚠️ Digite seu e-mail primeiro.",
          "error"
        );

        return;
      }


      try {

        await sendPasswordResetEmail(
          auth,
          email
        );


        showMsg(
          "loginMsg",
          "📧 E-mail de recuperação enviado!",
          "success"
        );

      } catch (e) {

        showMsg(
          "loginMsg",
          "❌ Não foi possível enviar o e-mail de recuperação.",
          "error"
        );

      }

    };


    /* GOOGLE */

    async function loginGoogle() {

      try {

        const provider =
          new GoogleAuthProvider();

        await signInWithPopup(
          auth,
          provider
        );


        /*
          Se quiser redirecionar após
          o Google:

          window.location.href = "index.html";
        */

      } catch (e) {

        showMsg(
          "loginMsg",
          "❌ Erro ao entrar com Google.",
          "error"
        );

      }

    }


    document
      .getElementById("btnGoogleLogin")
      .onclick = loginGoogle;


    document
      .getElementById("btnGoogleRegister")
      .onclick = loginGoogle;


  </script>


  <!-- FUNÇÕES DA INTERFACE -->

  <script>

    function switchTab(tab) {

      const login =
        tab === "login";


      document
        .getElementById("tabLogin")
        .classList
        .toggle("active", login);


      document
        .getElementById("tabRegister")
        .classList
        .toggle("active", !login);


      document
        .getElementById("formLogin")
        .classList
        .toggle("active", login);


      document
        .getElementById("formRegister")
        .classList
        .toggle("active", !login);


      document
        .querySelectorAll(".auth-msg")
        .forEach(el => {

          el.style.display = "none";

        });

    }


    function togglePwd(inputId, button) {

      const input =
        document.getElementById(inputId);


      if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

      } else {

        input.type = "password";

        button.textContent = "👁";

      }

    }

  </script>

</body>
</html>
